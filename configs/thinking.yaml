# One two-turn scenario with backend-default reasoning; SHISA_API_KEY must be set.
dataset_repo: configs/smoke_scenario.json
dataset_split: train
target_model_name: qwen3.8-27b
user_model_name: qwen3.8-27b
target_base_url: https://api.shisa.ai/openai/v1
user_base_url: https://api.shisa.ai/openai/v1
target_api_key_env: SHISA_API_KEY
user_api_key_env: SHISA_API_KEY
target_timeout: 240
user_timeout: 240
target_request_options:
  temperature: 0.7
  max_tokens: 8192
user_request_options:
  temperature: 0.7
  max_tokens: 8192
target_token_limit_ceiling: 32768
user_token_limit_ceiling: 32768
target_max_token_retries: 2
user_max_token_retries: 2
max_turns: 2
max_workers: 1
max_samples: 1
output_dir: results/thinking
