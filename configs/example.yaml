# Two-turn smoke test; load SHISA_API_KEY in the environment before running.
dataset_repo: configs/smoke_scenario.json
dataset_split: train
target_model_name: shisa-ai/shisa-v2.1-llama3.3-70b
user_model_name: shisa-ai/shisa-v2.1-llama3.3-70b
target_base_url: https://api.shisa.ai/openai/v1
user_base_url: https://api.shisa.ai/openai/v1
target_api_key_env: SHISA_API_KEY
user_api_key_env: SHISA_API_KEY
target_request_options:
  temperature: 0.7
  max_tokens: 256
user_request_options:
  temperature: 0.7
  max_tokens: 256
target_max_retries: 1
user_max_retries: 1
max_turns: 2
max_workers: 1
max_samples: 1
output_dir: results
