[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese_rp_bench"
version = "0.1.0"
description = "LLMのロールプレイ能力を測るベンチマーク"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Aratako" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["LLM", "Roleplay", "Benchmark", "Japanese"]
dependencies = [
    "httpx>=0.27,<1",
    "datasets>=3,<6",
    "click>=8,<9",
    "PyYAML>=6,<7",
]

[project.urls]
"Homepage" = "https://github.com/Aratako/Japanese-RP-Bench"
"Repository" = "https://github.com/Aratako/Japanese-RP-Bench"

[project.scripts]
japanese-rp-bench = "japanese_rp_bench.cli:main"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pytest-timeout>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
xfail_strict = true
timeout = 30

[tool.coverage.run]
branch = true
source = ["japanese_rp_bench"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.setuptools.package-data]
japanese_rp_bench = ["evaluation_prompt.txt"]
